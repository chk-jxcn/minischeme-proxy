name: App Proxy & Protocol Converter CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python -m pytest -v tests

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')   # releases only from a pushed version tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Package Release Archive
      run: |
        zip -r minischeme-proxy.zip server.py app_proxy.py proxy tools requirements.txt config.example.ini pytest.ini README.md

    - name: Publish Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MiniScheme App Proxy & Protocol Converter (${{ github.ref_name }})"
        make_latest: true
        files: |
          minischeme-proxy.zip
          requirements.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

